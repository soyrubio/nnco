name: Deploy stage

on:
  push:
    branches:
      - stage
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-stage
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy authenticated stage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: stage
      url: https://stage.nnco.ai
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run tests
        run: pnpm test

      - name: Build stage Worker
        env:
          DISCOVERY_ENABLED: ${{ vars.DISCOVERY_ENABLED || 'false' }}
        run: pnpm build:stage

      - name: Deploy stage Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          wranglerVersion: 4.122.0
          command: deploy --env stage
